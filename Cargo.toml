[package]
name = "rustbucket"
version = "0.1.0"
edition = "2024"
license = "WTFPL"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
askama = "0.16.1"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.9", features = ["derive", "env"] }
getrandom = "0.4.3"
http-body-util = "0.1.5"
httpdate = "1.0.3"
ipnet = { version = "2.12.2", features = ["serde"] }
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rustix = { version = "1", features = ["fs"] }
png = "0.18.1"
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "macros", "migrate", "sqlite"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "fs", "io-util"] }
tokio-util = { version = "0.7.20", features = ["io"] }
toml = "1.2.1"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
unicode-normalization = "0.1.26"

[dev-dependencies]
tempfile = "3.27.0"
thirtyfour = "0.38.3"
