# TLS front end inside the standalone container. Runs unprivileged (no `user` directive, all paths in /tmp).
worker_processes 2;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    access_log off;                      # the server logs every request itself
    server_tokens off;
    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    # sync clients upload big files in chunks, but plain PUT of a large file must work too: stream, never buffer
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_body_timeout 3600s;

    # WebSocket (the live editor): pass the upgrade on, leave Connection empty for normal requests (keeps backend keep-alive)
    map $http_upgrade $rb_conn {
        default upgrade;
        ''      '';
    }

    server {
        listen 8443 ssl;
        http2 on;

        ssl_certificate     /certs/tls.crt;
        ssl_certificate_key /certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:2m;
        ssl_session_timeout 1h;
        ssl_session_tickets off;

        location / {
            # no URI part: the request target (with its percent-encoding) is passed on untouched
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_set_header X-Forwarded-Proto https;
            # overwrite, never append: the server trusts the first entry, so a client must not be able to supply it
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $rb_conn;
        }
    }
}
