sonar.projectKey=rustbucket
sonar.projectName=rustbucket
sonar.sources=src,static,templates
sonar.tests=tests
sonar.exclusions=static/htmx.min.js,fuzz/**,target/**
sonar.coverageReportPaths=lcov.info
sonar.sourceEncoding=UTF-8

# Reviewed findings that are accepted by design (the reasoning is also in the templates)
sonar.issue.ignore.multicriteria=e1,e2
# files.html embeds the output of our own fragment template, which askama has already escaped
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:S5247
sonar.issue.ignore.multicriteria.e1.resourceKey=templates/files.html
# single-purpose login pages: the cursor belongs in the username field (they allow no script, so it cannot be set from JS)
sonar.issue.ignore.multicriteria.e2.ruleKey=Web:S9379
sonar.issue.ignore.multicriteria.e2.resourceKey=templates/*login.html
