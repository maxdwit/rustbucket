{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>rustbucket</h1>
<form method="post" action="/login">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="redirect_url" value="{{ redirect }}">
  <label for="username">Account name</label>
  <input id="username" type="text" name="username" autocomplete="username" autocapitalize="none" required autofocus>
  <label for="password">Password</label>
  <input id="password" type="password" name="password" autocomplete="current-password" required>
  {% if let Some(e) = error %}<p class="err" role="alert">{{ e }}</p>{% endif %}
  <button type="submit">Sign in</button>
</form>
{% endblock %}
